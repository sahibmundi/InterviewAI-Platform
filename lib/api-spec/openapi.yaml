openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: InterviewAI application API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Practice overview and progress
  - name: profile
    description: Candidate profile
  - name: ai
    description: AI-powered resume analysis and interview coaching
  - name: interviews
    description: Interview history and reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the candidate dashboard
      description: Returns the current candidate's practice readiness, metrics, next recommendation, and recent interview activity.
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Authentication required
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the candidate profile
      responses:
        "200":
          description: Candidate profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "401":
          description: Authentication required
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the candidate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated candidate profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "400":
          description: Invalid profile data
        "401":
          description: Authentication required
  /ai/resume-analysis:
    post:
      operationId: analyzeResume
      tags: [ai]
      summary: Analyze a resume with Gemini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeAnalysisInput"
      responses:
        "200":
          description: Resume analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeAnalysis"
        "400":
          description: Invalid resume input
        "401":
          description: Authentication required
        "503":
          description: AI provider unavailable
  /ai/coach:
    post:
      operationId: askCoach
      tags: [ai]
      summary: Ask the AI interview coach a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachInput"
      responses:
        "200":
          description: Coach answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachResponse"
        "400":
          description: Invalid coach input
        "401":
          description: Authentication required
        "503":
          description: AI provider unavailable
  /interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      summary: List previous interviews
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [all, technical, hr, behavioral, project, coding, mixed]
            default: all
      responses:
        "200":
          description: Interview history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewSummary"
        "401":
          description: Authentication required
    post:
      operationId: createInterview
      tags: [interviews]
      summary: Create an interview from a configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewInput"
      responses:
        "201":
          description: Interview created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
        "400":
          description: Invalid interview configuration
        "401":
          description: Authentication required
  /interviews/{interviewId}:
    get:
      operationId: getInterview
      tags: [interviews]
      summary: Get an interview report
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interview report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
        "404":
          description: Interview not found
        "401":
          description: Authentication required
  /interviews/{interviewId}/session:
    get:
      operationId: getInterviewSession
      tags: [interviews]
      summary: Get the active interview session
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Active interview session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "404":
          description: Interview not found
        "401":
          description: Authentication required
  /interviews/{interviewId}/answers:
    post:
      operationId: submitInterviewAnswer
      tags: [interviews]
      summary: Submit an answer for the active interview question
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewAnswerInput"
      responses:
        "200":
          description: Updated interview session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "400":
          description: Invalid answer
        "404":
          description: Interview not found
        "401":
          description: Authentication required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CandidateProfile:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        education:
          type: string
        degree:
          type: string
        university:
          type: string
        graduationYear:
          type: integer
          minimum: 1950
          maximum: 2100
        experience:
          type: string
        skills:
          type: array
          items:
            type: string
        preferredRole:
          type: string
        yearsOfExperience:
          type: number
          minimum: 0
        profileCompletion:
          type: integer
          minimum: 0
          maximum: 100
        resumeName:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - email
        - education
        - degree
        - university
        - graduationYear
        - experience
        - skills
        - preferredRole
        - yearsOfExperience
        - profileCompletion
        - resumeName
        - updatedAt
    ProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        education:
          type: string
        degree:
          type: string
        university:
          type: string
        graduationYear:
          type: integer
          minimum: 1950
          maximum: 2100
        experience:
          type: string
        skills:
          type: array
          items:
            type: string
        preferredRole:
          type: string
        yearsOfExperience:
          type: number
          minimum: 0
    ResumeAnalysisInput:
      type: object
      properties:
        resumeText:
          type: string
          minLength: 40
          maxLength: 60000
        jobDescription:
          type: string
          maxLength: 16000
      required: [resumeText]
    ResumeAnalysis:
      type: object
      properties:
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        rewrittenBullets:
          type: array
          items:
            type: string
        nextSteps:
          type: array
          items:
            type: string
      required: [overallScore, summary, strengths, gaps, keywords, rewrittenBullets, nextSteps]
    CoachInput:
      type: object
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 6000
        context:
          type: string
          maxLength: 20000
      required: [question]
    CoachResponse:
      type: object
      properties:
        answer:
          type: string
        framework:
          type: string
        followUps:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
      required: [answer, framework, followUps, sources]
    ReadinessMetric:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer
          minimum: 0
          maximum: 100
        change:
          type: number
        color:
          type: string
      required: [label, value, change, color]
    ProgressPoint:
      type: object
      properties:
        label:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
      required: [label, score]
    PracticeRecommendation:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        duration:
          type: string
        action:
          type: string
      required: [title, description, category, duration, action]
    WeakArea:
      type: object
      properties:
        name:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        severity:
          type: string
          enum: [high, medium, low]
      required: [name, score, severity]
    InterviewSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [technical, hr, behavioral, project, coding, mixed]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        score:
          type: integer
          minimum: 0
          maximum: 100
        questions:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ready, in_progress, completed]
        completedAt:
          type: string
          format: date-time
        duration:
          type: string
      required: [id, title, type, difficulty, score, questions, status, completedAt, duration]
    Dashboard:
      type: object
      properties:
        candidate:
          $ref: "#/components/schemas/CandidateProfile"
        readinessScore:
          type: integer
          minimum: 0
          maximum: 100
        readinessLabel:
          type: string
        readinessDescription:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessMetric"
        progress:
          type: array
          items:
            $ref: "#/components/schemas/ProgressPoint"
        recommendation:
          $ref: "#/components/schemas/PracticeRecommendation"
        weakAreas:
          type: array
          items:
            $ref: "#/components/schemas/WeakArea"
        recentInterviews:
          type: array
          items:
            $ref: "#/components/schemas/InterviewSummary"
      required: [candidate, readinessScore, readinessLabel, readinessDescription, metrics, progress, recommendation, weakAreas, recentInterviews]
    InterviewInput:
      type: object
      properties:
        type:
          type: string
          enum: [hr, technical, behavioral, project, coding, mixed]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        questionCount:
          type: integer
          enum: [5, 10, 15, 20]
        answerMode:
          type: string
          enum: [text, voice]
        source:
          type: string
          enum: [general, resume, job_description, resume_and_job_description]
      required: [type, difficulty, questionCount, answerMode, source]
    Interview:
      allOf:
        - $ref: "#/components/schemas/InterviewSummary"
        - type: object
          properties:
            answerMode:
              type: string
              enum: [text, voice]
            source:
              type: string
              enum: [general, resume, job_description, resume_and_job_description]
            status:
              type: string
              enum: [ready, in_progress, completed]
            categoryScores:
              type: object
              additionalProperties:
                type: integer
            questionsAsked:
              type: array
              items:
                type: string
            strongAreas:
              type: array
              items:
                type: string
            weakAreas:
              type: array
              items:
                type: string
            recommendedTopics:
              type: array
              items:
                type: string
          required: [answerMode, source, status, categoryScores, questionsAsked, strongAreas, weakAreas, recommendedTopics]
    InterviewQuestion:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
        prompt:
          type: string
        category:
          type: string
      required: [index, prompt, category]
    InterviewAnswer:
      type: object
      properties:
        questionIndex:
          type: integer
          minimum: 0
        answer:
          type: string
        submittedAt:
          type: string
          format: date-time
      required: [questionIndex, answer, submittedAt]
    InterviewAnswerInput:
      type: object
      properties:
        questionIndex:
          type: integer
          minimum: 0
        answer:
          type: string
          minLength: 1
      required: [questionIndex, answer]
    InterviewSession:
      type: object
      properties:
        interview:
          $ref: "#/components/schemas/Interview"
        currentQuestion:
          oneOf:
            - $ref: "#/components/schemas/InterviewQuestion"
            - type: "null"
        currentQuestionIndex:
          type: integer
          minimum: 0
        answeredCount:
          type: integer
          minimum: 0
        totalQuestions:
          type: integer
          minimum: 1
        answers:
          type: array
          items:
            $ref: "#/components/schemas/InterviewAnswer"
        completed:
          type: boolean
      required: [interview, currentQuestion, currentQuestionIndex, answeredCount, totalQuestions, answers, completed]

