kind = "web"
previewPath = "/"
title = "InterviewAI"
description = "A premium AI interview coach for students, graduates, and software professionals to prepare with personalized practice, candidate profiles, and measurable progress."
version = "1.0.0"
id = "artifacts/interview-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23149

[services.development]
run = "pnpm --filter @workspace/interview-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/interview-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/interview-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23149"
BASE_PATH = "/"
